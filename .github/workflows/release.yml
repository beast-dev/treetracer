name: Release

# Triggered by tag push (e.g. ``git tag v0.1.0 && git push --tags``) or
# manually via the Actions tab for dry runs. Each OS produces its own
# installer artifact; on a tag push, all three are attached to the
# GitHub Release.

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false   # never cancel an in-flight release build

jobs:
    build:
        name: Build (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      target: macOS
                      package-args: --adhoc-sign
                      artifact-glob: 'dist/*.dmg'
                    - os: windows-latest
                      target: windows
                      package-args: ''
                      artifact-glob: 'dist/*.msi'
                    - os: ubuntu-latest
                      target: linux
                      package-args: ''
                      artifact-glob: 'dist/*.AppImage'

        steps:
            - uses: actions/checkout@v4

            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: '**/uv.lock'

            - uses: actions/setup-python@v5
              with:
                  python-version-file: .python-version

            - name: Sync packaging deps
              run: uv sync --locked --group package

            # AppImage build needs GTK/WebKit dev headers on the host machine
            # (Briefcase builds inside a manylinux container but copies
            # PyGObject / pycairo wheels from the host's pip cache).
            - name: Install Linux system deps
              if: matrix.target == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libwebkit2gtk-4.1-dev gir1.2-webkit2-4.1 \
                      gir1.2-gtk-3.0 libgirepository-2.0-dev libcairo2-dev \
                      pkg-config

            - name: Briefcase config sanity
              run: uv run --no-sync python tools/check_briefcase_sync.py

            - name: Briefcase create
              run: uv run --no-sync briefcase create ${{ matrix.target }} --no-input

            - name: Briefcase build
              run: uv run --no-sync briefcase build ${{ matrix.target }} --no-input

            - name: Briefcase package
              run: uv run --no-sync briefcase package ${{ matrix.target }} --no-input ${{ matrix.package-args }}

            - uses: actions/upload-artifact@v4
              with:
                  name: treetracer-${{ matrix.target }}
                  path: ${{ matrix.artifact-glob }}
                  if-no-files-found: error

            - name: Attach to GitHub Release
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v2
              with:
                  files: ${{ matrix.artifact-glob }}
                  draft: true   # human approves before publishing
                  generate_release_notes: true
