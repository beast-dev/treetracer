name: Release

# Triggered by tag push (e.g. ``git tag v0.1.0 && git push --tags``) or
# manually via the Actions tab for dry runs. Each OS produces its own
# installer artifact; on a tag push, all three are attached to the
# GitHub Release.

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false   # never cancel an in-flight release build

# Node 20 is deprecated on GitHub-hosted runners (forced to Node 24 from
# 2026-06-02, removed 2026-09-16). This opts our existing actions into
# Node 24 now. Drop once each action publishes a Node-24-native major.
env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    build:
        name: Build (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      target: macOS
                      # Briefcase's default macOS format ``app`` produces the .dmg.
                      format: ''
                      package-args: --adhoc-sign
                      artifact-glob: 'dist/*.dmg'
                    - os: windows-latest
                      target: windows
                      # Default Windows format is ``app`` → .msi.
                      format: ''
                      package-args: ''
                      artifact-glob: 'dist/*.msi'
                    - os: ubuntu-latest
                      target: linux
                      # Briefcase's default Linux format is ``system`` (a .deb
                      # tied to the host's system python — fails when the CI
                      # Python doesn't match Ubuntu's). We want a portable
                      # AppImage built in a manylinux docker container.
                      format: AppImage
                      package-args: ''
                      artifact-glob: 'dist/*.AppImage'

        steps:
            - uses: actions/checkout@v4

            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: '**/uv.lock'

            - uses: actions/setup-python@v5
              with:
                  python-version-file: .python-version

            - name: Sync packaging deps
              run: uv sync --locked --group package

            # Belt-and-braces. The AppImage compile happens inside a
            # manylinux Docker container with its own GTK headers
            # (from ``system_requires`` in pyproject.toml's appimage
            # block), but having them on the host too lets ``briefcase
            # dev`` work for local debugging without docker.
            - name: Install Linux system deps
              if: matrix.target == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libwebkit2gtk-4.1-dev gir1.2-webkit2-4.1 \
                      gir1.2-gtk-3.0 libgirepository-2.0-dev libcairo2-dev \
                      pkg-config

            - name: Briefcase config sanity
              run: uv run --no-sync python tools/check_briefcase_sync.py

            - name: Briefcase create
              run: uv run --no-sync briefcase create ${{ matrix.target }} ${{ matrix.format }} --no-input

            - name: Briefcase build
              run: uv run --no-sync briefcase build ${{ matrix.target }} ${{ matrix.format }} --no-input

            - name: Briefcase package
              run: uv run --no-sync briefcase package ${{ matrix.target }} ${{ matrix.format }} --no-input ${{ matrix.package-args }}

            - uses: actions/upload-artifact@v4
              with:
                  name: treetracer-${{ matrix.target }}
                  path: ${{ matrix.artifact-glob }}
                  if-no-files-found: error

            - name: Attach to GitHub Release
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v2
              with:
                  files: ${{ matrix.artifact-glob }}
                  draft: true   # human approves before publishing
                  generate_release_notes: true
