name: CI

on:
    push:
        branches: [master, main]
    pull_request:
        branches: [master, main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Node 20 is deprecated on GitHub-hosted runners (forced to Node 24 from
# 2026-06-02, removed 2026-09-16). This opts our existing actions into
# Node 24 now. Drop once each action publishes a Node-24-native major.
env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    test:
        name: Tests (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: '**/uv.lock'

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version-file: .python-version

            - name: Sync dependencies (test group)
              run: uv sync --locked --group test

            - name: Run tests
              run: uv run --no-sync pytest src/test/ -v

    # Verify Briefcase config hasn't drifted from [project] and that the
    # runtime dep set alone is enough to import treetracer (i.e. no test-
    # only dep has accidentally been imported by production code).
    config-checks:
        name: Config sanity
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: '**/uv.lock'
            - uses: actions/setup-python@v5
              with:
                  python-version-file: .python-version

            - name: Briefcase / project deps in sync
              run: uv run --no-sync python tools/check_briefcase_sync.py

            - name: Runtime deps alone are sufficient
              # Install only [project].dependencies — no [dependency-groups].
              # Then import the package's main module. If a runtime file
              # imports anything from arviz / dendropy / briefcase / pytest,
              # this fails here rather than at user install time.
              run: |
                  uv sync --locked --no-default-groups
                  uv run --no-sync python -c "import treetracer; import treetracer.app; import treetracer.ui"

    # Build the wheel + sdist to catch packaging-only regressions
    # (e.g. an Asset getting accidentally excluded by hatch). Ubuntu
    # is enough for this — wheels are pure-Python.
    build:
        name: Build wheel + sdist
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: '**/uv.lock'
            - uses: actions/setup-python@v5
              with:
                  python-version-file: .python-version
            - run: uv build
